name: EasyTier Docker (custom)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '运行 id：产出 5 个架构二进制 artifact 的那次构建（docker-artifacts.yml 或 docker-artifacts-all.yml 都行；artifact 名字是 easytier-linux-<arch>）'
        type: number
        required: true
      image_tag:
        description: '镜像 tag（不带 registry 前缀）'
        type: string
        default: 'dev'
        required: true
      mark_latest:
        description: '同时打 latest 标签'
        type: boolean
        default: false
        required: true
      mark_unstable:
        description: '同时打 unstable 标签'
        type: boolean
        default: false
        required: true
      push_ghcr:
        description: '推送到 GHCR'
        type: boolean
        default: true
        required: true
      push_dockerhub:
        description: '推送到 Docker Hub'
        type: boolean
        default: false
        required: true
      push_acr:
        description: '推送到阿里云 ACR'
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  docker:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate inputs
        env:
          MARK_LATEST: ${{ inputs.mark_latest }}
          MARK_UNSTABLE: ${{ inputs.mark_unstable }}
          PUSH_GHCR: ${{ inputs.push_ghcr }}
          PUSH_DOCKERHUB: ${{ inputs.push_dockerhub }}
          PUSH_ACR: ${{ inputs.push_acr }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          set -euo pipefail
          if [[ "$MARK_LATEST" == "true" && "$MARK_UNSTABLE" == "true" ]]; then
            echo "::error::mark_latest 和 mark_unstable 不能同时为 true"
            exit 1
          fi
          if [[ "$PUSH_GHCR" != "true" && "$PUSH_DOCKERHUB" != "true" && "$PUSH_ACR" != "true" ]]; then
            echo "::error::至少要勾选一个推送目标"
            exit 1
          fi
          if [[ "$PUSH_DOCKERHUB" == "true" ]]; then
            if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
              echo "::error::推送 Docker Hub 需要 secrets.DOCKERHUB_USERNAME 和 secrets.DOCKERHUB_TOKEN"
              exit 1
            fi
          fi
          if [[ "$PUSH_ACR" == "true" ]]; then
            if [[ -z "$ACR_REGISTRY" || -z "$ACR_USERNAME" || -z "$ACR_PASSWORD" || -z "$ACR_NAMESPACE" ]]; then
              echo "::error::推送阿里云 ACR 需要 secrets.ACR_REGISTRY / ACR_USERNAME / ACR_PASSWORD / ACR_NAMESPACE"
              exit 1
            fi
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ inputs.push_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ inputs.push_dockerhub }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        if: ${{ inputs.push_acr }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 只给 run_id，不给 workflow：dawidd6/action-download-artifact@v11 在有
      # run_id 时直接按 run_id 拉 artifact（listWorkflowRunArtifacts），workflow
      # 输入不参与过滤，只用来打印一行日志。写死 workflow 名反而会在填
      # docker-artifacts-all.yml 的 run_id 时与实际来源不符。
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ inputs.run_id }}
          repo: ${{ github.repository }}
          path: docker_context
          if_no_artifact_found: fail

      - name: List files
        run: |
          ls -l -R docker_context

      - name: Prepare Docker tags
        id: tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          MARK_LATEST: ${{ inputs.mark_latest }}
          MARK_UNSTABLE: ${{ inputs.mark_unstable }}
          PUSH_GHCR: ${{ inputs.push_ghcr }}
          PUSH_DOCKERHUB: ${{ inputs.push_dockerhub }}
          PUSH_ACR: ${{ inputs.push_acr }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          set -euo pipefail

          # 单个镜像的标签串：基础 tag + 可选的 latest / unstable
          image_tags() {
            local image="$1"
            local out="${image}:${IMAGE_TAG}"
            if [[ "$MARK_LATEST" == "true" ]]; then
              out="${out},${image}:latest"
            fi
            if [[ "$MARK_UNSTABLE" == "true" ]]; then
              out="${out},${image}:unstable"
            fi
            printf '%s' "$out"
          }

          # 把若干标签段拼成 build-push-action 需要的逗号列表
          join_tags() {
            local sep="" t
            for t in "$@"; do
              [[ -z "$t" ]] && continue
              printf '%s%s' "$sep" "$t"
              sep=","
            done
          }

          attested=()
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/easytier-custom"
          hub_image="${DOCKERHUB_USERNAME,,}/easytier-custom"
          acr_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/easytier-custom"

          # mirror_repo 是"已带 attestation 的那份镜像"所在仓库，供 ACR 拷贝时读取
          mirror_repo=""
          if [[ "$PUSH_GHCR" == "true" ]]; then
            attested+=("$(image_tags "$ghcr_image")")
            mirror_repo="$ghcr_image"
          fi
          if [[ "$PUSH_DOCKERHUB" == "true" ]]; then
            attested+=("$(image_tags "$hub_image")")
            if [[ -z "$mirror_repo" ]]; then
              mirror_repo="$hub_image"
            fi
          fi

          ACR_TAGS=""
          if [[ "$PUSH_ACR" == "true" ]]; then
            ACR_TAGS="$(image_tags "$acr_image")"
          fi

          echo "attested_tags=$(join_tags ${attested[@]+"${attested[@]}"})" >> "$GITHUB_OUTPUT"
          echo "acr_tags=${ACR_TAGS}" >> "$GITHUB_OUTPUT"
          echo "mirror_repo=${mirror_repo}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "GHCR / Docker Hub tags: $(join_tags ${attested[@]+"${attested[@]}"})"
          echo "Aliyun ACR tags: ${ACR_TAGS:-<none>}"
          echo "ACR mirror source: ${mirror_repo:-<none>}"

      # 一次构建产物：GHCR / Docker Hub 认识 OCI attestation manifest，
      # 保留 buildx 默认的 provenance + SBOM，镜像附带来源证明
      - name: Build and push (GHCR / Docker Hub)
        if: ${{ inputs.push_ghcr || inputs.push_dockerhub }}
        uses: docker/build-push-action@v6
        with:
          context: ./docker_context
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/riscv64
          push: true
          provenance: true
          sbom: true
          file: .github/workflows/Dockerfile
          tags: ${{ steps.tags.outputs.attested_tags }}

      # 只勾了阿里云时没有可镜像的源，直接构建并在构建阶段就关掉 attestation
      - name: Build and push (Aliyun ACR only)
        if: ${{ inputs.push_acr && !(inputs.push_ghcr || inputs.push_dockerhub) }}
        uses: docker/build-push-action@v6
        with:
          context: ./docker_context
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/riscv64
          push: true
          provenance: false
          sbom: false
          file: .github/workflows/Dockerfile
          tags: ${{ steps.tags.outputs.acr_tags }}

      # 阿里云 ACR 不认 application/vnd.oci.empty.v1+json 这类 attestation manifest，
      # 会以 "unknown manifest class" 拒绝整个 push。这里不重建镜像，
      # 而是从已推好的 index 里挑出 5 个真实平台条目，拼成一个不含 attestation 的
      # 干净 index 推到 ACR——层数据由 buildx 从源仓库直接复制，不经过二次构建。
      - name: Mirror to Aliyun ACR (strip attestation)
        if: ${{ inputs.push_acr && (inputs.push_ghcr || inputs.push_dockerhub) }}
        env:
          MIRROR_REPO: ${{ steps.tags.outputs.mirror_repo }}
          IMAGE_TAG: ${{ steps.tags.outputs.image_tag }}
          ACR_TAGS: ${{ steps.tags.outputs.acr_tags }}
        run: |
          set -euo pipefail

          source_ref="${MIRROR_REPO}:${IMAGE_TAG}"
          echo "镜像源: ${source_ref}"

          # 只取真实平台条目，丢掉 unknown/unknown 的 attestation manifest
          raw="$(docker buildx imagetools inspect --raw "$source_ref")"
          mapfile -t digests < <(
            printf '%s' "$raw" \
              | python3 -c 'import json,sys;idx=json.load(sys.stdin);print("\n".join(m["digest"] for m in idx.get("manifests",[]) if (m.get("platform") or {}).get("os")=="linux"))' \
              | grep -v '^$' || true
          )

          if [[ "${#digests[@]}" -ne 5 ]]; then
            echo "::error::从 ${source_ref} 只筛出 ${#digests[@]} 个平台条目，预期 5 个"
            printf '%s\n' "$raw"
            exit 1
          fi

          for d in "${digests[@]}"; do
            echo "  平台条目 ${d}"
          done

          sources=()
          for d in "${digests[@]}"; do
            sources+=("${MIRROR_REPO}@${d}")
          done

          tag_args=()
          IFS=',' read -ra tag_list <<< "$ACR_TAGS"
          for t in "${tag_list[@]}"; do
            tag_args+=(-t "$t")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          echo "已推送到阿里云 ACR：${ACR_TAGS}"
