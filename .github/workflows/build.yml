name: EasyTier Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign_windows:
        description: Submit Windows command-line binaries for SignPath test signing
        type: boolean
        default: false
      sign_macos:
        description: Sign and notarize macOS GUI (requires Apple secrets)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: easytier-build-full-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Plan release builds
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.plan.outputs.active }}
      full: ${{ steps.plan.outputs.full }}
      rust: ${{ steps.plan.outputs.rust }}
      frontend: ${{ steps.plan.outputs.frontend }}
      ci: ${{ steps.plan.outputs.ci }}
      go: ${{ steps.plan.outputs.go }}
      js: ${{ steps.plan.outputs.js }}
      nix: ${{ steps.plan.outputs.nix }}
      core_matrix: ${{ steps.plan.outputs.core_matrix }}
      gui_matrix: ${{ steps.plan.outputs.gui_matrix }}
      android_matrix: ${{ steps.plan.outputs.android_matrix }}
      check_matrix: ${{ steps.plan.outputs.check_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/github-script@v8
        id: plan
        with:
          script: |
            const prepare = require('./.github/scripts/prepare-build.js');
            await prepare({ github, context, core });

  frontend:
    name: Shared production frontend assets
    needs: prepare
    if: needs.prepare.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-build
        with:
          target: wasm32-unknown-unknown
          pnpm: true
          token: ${{ github.token }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: frontend-wasm
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: pnpm build:frontend:ci
      - name: Package shared resources
        run: |
          mkdir -p easytier-web/frontend/dist/config-generator
          cp -R easytier-web/config-generator/dist/. easytier-web/frontend/dist/config-generator/
          test -s easytier-web/frontend/dist/index.html
          test -s easytier-web/frontend/dist/config-generator/index.html
          test -s easytier-gui/dist/index.html
          tar -czf frontend-assets.tar.gz easytier-web/frontend/dist easytier-web/frontend-lib/dist easytier-gui/dist
      - uses: ./.github/actions/shared-resources
        with:
          mode: save
          name: frontend
          path: frontend-assets.tar.gz

  core:
    name: CLI (${{ matrix.name }})
    needs: [prepare, frontend]
    if: needs.prepare.outputs.full == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.core_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
      ARTIFACT_NAME: easytier-${{ matrix.name }}
    steps:
      # git_version! runs git describe at compile time; tags are required for the
      # Docker binaries to report a tag-based version instead of a bare sha.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      # Without an exact tag, tag HEAD locally so the version becomes *-custom-dev.
      # The tag is never pushed.
      - name: Resolve version
        if: matrix.dockerArch != ''
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Building for tag ${GITHUB_REF_NAME}"
          elif git describe --tags --exact-match >/dev/null 2>&1; then
            echo "Building at exact tag $(git describe --tags --exact-match)"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -f -a dev -m "dev build" HEAD
            echo "No exact tag; tagged HEAD as dev"
          fi
          echo "git describe: $(git describe --tags --abbrev=8 --always --dirty=~)"
      - uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.target }}
          token: ${{ github.token }}
      # Only release targets consume the frontend assets (build-core.sh asserts them,
      # the smoke test runs the embedded Web). Docker-only targets compile two bare
      # binaries and skip all three steps.
      - uses: actions/setup-node@v5
        if: matrix.release
        with:
          node-version: 22
      - uses: ./.github/actions/shared-resources
        if: matrix.release
        with:
          mode: restore
          name: frontend
          path: frontend-assets.tar.gz
      - run: tar -xzf frontend-assets.tar.gz
        if: matrix.release
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-release-${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: 0.16.0
          use-cache: true
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild@0.23.2
      - name: Build command-line programs
        if: matrix.release
        run: bash .github/scripts/build-core.sh
      # Docker-only targets skip the release script (no Web/mini) and compile just
      # the two binaries the image needs.
      - name: Build Docker binaries
        if: matrix.dockerArch != '' && !matrix.release
        run: |
          set -euo pipefail
          cargo zigbuild --locked --release --target "$TARGET" -p easytier \
            --features "$FEATURES" --bin easytier-core --bin easytier-cli
      # Artifact name becomes the download directory, matching the Dockerfile's
      # cp paths: easytier-linux-<arch>/{easytier-core,easytier-cli}.
      - name: Stage Docker binaries
        if: matrix.dockerArch != ''
        run: |
          set -euo pipefail
          mkdir -p "easytier-linux-${{ matrix.dockerArch }}"
          cp "target/$TARGET/release/easytier-core" \
             "target/$TARGET/release/easytier-cli" \
             "easytier-linux-${{ matrix.dockerArch }}/"
          chmod 755 easytier-linux-"${{ matrix.dockerArch }}"/*
          file easytier-linux-"${{ matrix.dockerArch }}"/*
      # No archive: false here — multiple files need the default packaged upload,
      # which docker.yml extracts back into per-artifact directories.
      - uses: actions/upload-artifact@v7
        if: matrix.dockerArch != ''
        with:
          name: easytier-linux-${{ matrix.dockerArch }}
          path: easytier-linux-${{ matrix.dockerArch }}/*
          retention-days: 7
          if-no-files-found: error
      - name: Verify Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.github/scripts/verify-windows-runtime.ps1 -Binary (Get-ChildItem artifacts/*.exe).FullName
      - name: Prepare optional Windows signing
        if: runner.os == 'Windows' && inputs.sign_windows
        run: |
          mkdir -p signpath-artifacts
          cp artifacts/*.exe signpath-artifacts/
      - uses: actions/upload-artifact@v5
        if: runner.os == 'Windows' && inputs.sign_windows
        id: signpath
        with:
          name: signpath-unsigned-${{ matrix.name }}
          path: signpath-artifacts/*.exe
          retention-days: 1
          if-no-files-found: error
      - uses: signpath/github-action-submit-signing-request@v2
        if: runner.os == 'Windows' && inputs.sign_windows
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 368cf38d-86d5-4bfe-a1fa-82a50dce7e9f
          project-slug: EasyTier
          signing-policy-slug: test-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.signpath.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-signed-artifacts
      - name: Use signed Windows binaries
        if: runner.os == 'Windows' && inputs.sign_windows
        run: cp signpath-signed-artifacts/*.exe artifacts/
      - name: Install browser smoke-test dependencies
        if: matrix.name == 'linux-x86_64' || matrix.name == 'windows-x86_64'
        uses: ./.github/actions/prepare-pnpm
      - name: Verify network creation with shipped Core and embedded Web
        if: matrix.name == 'linux-x86_64' || matrix.name == 'windows-x86_64'
        run: |
          pnpm --dir easytier-web/frontend exec playwright install --with-deps chromium
          EASYTIER_SMOKE_BIN_DIR="$PWD/artifacts" pnpm --dir easytier-web/frontend exec node --test tests/local-config-creation.test.mjs
      - name: Package binaries with checksums and Unix executable permissions
        id: package
        if: matrix.release
        run: node .github/scripts/package-build.js "$ARTIFACT_NAME" artifacts dist "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        if: matrix.release
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          retention-days: 7
          if-no-files-found: error

  gui:
    name: GUI (${{ matrix.name }})
    needs: [prepare, frontend]
    if: needs.prepare.outputs.full == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.gui_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.target }}
          pnpm: true
          token: ${{ github.token }}
      - uses: ./.github/actions/shared-resources
        with:
          mode: restore
          name: frontend
          path: frontend-assets.tar.gz
      - run: tar -xzf frontend-assets.tar.gz
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gui-release-${{ matrix.target }}
      - name: Include Windows network drivers
        if: runner.os == 'Windows'
        run: bash .github/scripts/copy-windows-drivers.sh "$TARGET" easytier-gui/src-tauri
      - name: Build Windows GUI installer
        if: runner.os == 'Windows'
        run: >-
          pnpm --dir easytier-gui tauri build --ci --target "$TARGET" --bundles nsis
          --config ../.github/tauri-ci.json -- --locked
      - name: Verify Windows GUI runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.github/scripts/verify-windows-runtime.ps1 -Binary "target/$env:TARGET/release/easytier-gui.exe"
      - name: Validate requested Apple signing configuration
        if: runner.os == 'macOS' && inputs.sign_macos
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
      - name: Build unsigned macOS GUI
        if: runner.os == 'macOS' && !inputs.sign_macos
        run: >-
          pnpm --dir easytier-gui tauri build --ci --target "$TARGET" --bundles dmg
          --config ../.github/tauri-ci.json -- --locked
      - name: Build signed macOS GUI
        if: runner.os == 'macOS' && inputs.sign_macos
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: easytier-gui
          args: --ci --target ${{ matrix.target }} --bundles dmg --config ../.github/tauri-ci.json -- --locked
      - name: Notarize and staple signed macOS DMG
        if: runner.os == 'macOS' && inputs.sign_macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for dmg in target/"$TARGET"/release/bundle/dmg/*.dmg; do
            codesign --verify --verbose=4 "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 40m
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
      - name: Prepare the single native installer
        id: package
        run: |
          mkdir -p artifacts
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp target/"$TARGET"/release/bundle/nsis/*.exe artifacts/
            extension=exe
          else
            cp target/"$TARGET"/release/bundle/dmg/*.dmg artifacts/
            extension=dmg
          fi
          node .github/scripts/package-build.js --single-native "easytier-gui-${{ matrix.name }}.$extension" artifacts dist "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android (${{ matrix.arch }})
    needs: [prepare, frontend]
    if: needs.prepare.outputs.full == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.android_matrix) }}
    runs-on: ubuntu-24.04
    env:
      TARGET: ${{ format('{0}-linux-android', matrix.arch) }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'build-tools;34.0.0 ndk;26.0.10792818 platform-tools platforms;android-34'
      - name: Configure Android tools
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818/" >> "$GITHUB_ENV"
      - uses: ./.github/actions/prepare-build
        with:
          target: ${{ env.TARGET }}
          pnpm: true
          token: ${{ github.token }}
      - uses: ./.github/actions/shared-resources
        with:
          mode: restore
          name: frontend
          path: frontend-assets.tar.gz
      - run: tar -xzf frontend-assets.tar.gz
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ matrix.arch }}-${{ needs.prepare.outputs.full }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build APK using the shared GUI frontend
        if: needs.prepare.outputs.full == 'true'
        run: >-
          pnpm --dir easytier-gui tauri android build --ci --apk --target "$ARCH"
          --split-per-abi --config ../.github/tauri-ci.json
      - name: Prepare the single ARM64 APK
        id: package
        if: needs.prepare.outputs.full == 'true'
        run: |
          mkdir -p artifacts
          cp easytier-gui/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk artifacts/
          node .github/scripts/package-build.js --single-native "easytier-mobile-android-$ARCH.apk" artifacts dist "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.full == 'true'
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          retention-days: 7
          if-no-files-found: error

  build-result:
    name: Build result
    needs: [prepare, frontend, core, gui, android]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify every planned job succeeded
        env:
          BUILD_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/check-build-results.js

  cleanup:
    name: Remove older main build artifacts
    needs: [prepare, build-result]
    if: needs.prepare.outputs.full == 'true' && github.ref == 'refs/heads/main' && needs.build-result.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        with:
          script: |
            const prune = require('./.github/scripts/prune-build-artifacts.cjs');
            await prune({ github, context, core });

  cleanup-resources:
    name: Remove older internal resource caches
    needs: [build-result]
    if: ${{ always() && needs.build-result.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        with:
          script: |
            const clear = require('./.github/scripts/clear-shared-caches.js');
            await clear({ github, context, core });
